version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  PQC TLS 1.3 Stack
#
#  Services:
#    api      — C++ Drogon server (ML-KEM-768 + ML-DSA-65)
#    ocsp     — OpenSSL OCSP responder (certificate revocation)
#    postgres — User and API data
#    redis    — Session key store
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── API Server ───────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: pqc_api
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/certs:ro        # mounted read-only at runtime
    environment:
      - TLS_CERT_PATH=/certs/server.crt
      - TLS_KEY_PATH=/certs/server.key
      - CA_CERT_PATH=/certs/ca.crt
      - SIGNING_KEY_PATH=/certs/server.key
      - OCSP_URL=http://ocsp:8080
      - DATABASE_URL=host=postgres port=5432 dbname=pqcapi user=pqcuser password=pqcpass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_PORT=8443
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocsp:
        condition: service_started
    restart: unless-stopped
    networks:
      - pqc_net

  # ── OCSP Responder ────────────────────────────────────────────────────────────
  # Runs OpenSSL's built-in OCSP responder against the static CA files.
  # The index.txt file is generated by the cert generation script.
  ocsp:
    image: alpine/openssl
    container_name: pqc_ocsp
    volumes:
      - ./certs:/certs:ro
    command: >
      ocsp
      -port 8080
      -index /certs/index.txt
      -CA /certs/ca.crt
      -rkey /certs/ca.key
      -rsigner /certs/ca.crt
      -text
    ports:
      - "8080:8080"
    networks:
      - pqc_net
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pqc_postgres
    environment:
      POSTGRES_DB:       pqcapi
      POSTGRES_USER:     pqcuser
      POSTGRES_PASSWORD: pqcpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pqcuser -d pqcapi"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pqc_net
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pqc_redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pqc_net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  pqc_net:
    driver: bridge
