<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PQC Sign — Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-logo">PQC Sign <span>ML-DSA-65</span></div>
    <div class="nav-right">
      <span class="nav-user" id="nav-user"></span>
      <a href="/verify.html" class="btn btn-ghost btn-sm">External Verifier</a>
      <button id="logout-btn" class="btn btn-ghost btn-sm">Logout</button>
    </div>
  </nav>

  <div id="toast-container"></div>

  <div class="main">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Signed Documents</div>
        <div class="stat-value" id="doc-count">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Signature Algorithm</div>
        <div class="stat-value" style="font-size:1rem;padding-top:.45rem">ML-DSA-65</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Key Exchange (TLS)</div>
        <div class="stat-value" style="font-size:.82rem;padding-top:.55rem;font-weight:600">X25519 + ML-KEM-768</div>
      </div>
    </div>

    <!-- Upload -->
    <div class="card">
      <div class="card-title">Sign a Document</div>
      <div id="drop-zone" class="drop-zone">
        <div style="font-size:2rem">📄</div>
        <p>Drop a PDF here or click to browse</p>
        <div class="file-name" id="file-name"></div>
        <input type="file" id="file-input" accept=".pdf,application/pdf">
      </div>
      <button id="sign-btn" class="btn btn-primary" disabled>Sign Document</button>
    </div>

    <!-- Documents -->
    <div class="card">
      <div class="card-title">Your Documents</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Filename</th>
              <th>Signed At</th>
              <th>SHA-256</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="doc-tbody">
            <tr><td colspan="5">
              <div class="empty-state">
                <span class="spinner" style="border-color:rgba(0,0,0,.12);border-top-color:var(--primary);width:1.5em;height:1.5em"></span>
              </div>
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Verify modal -->
  <div id="verify-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Verify — <span id="verify-modal-filename" style="color:var(--muted);font-weight:400"></span></div>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <p style="color:var(--muted);font-size:.875rem">
        Checking ML-DSA-65 signature against the stored document…
      </p>
      <div id="verify-result"></div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
