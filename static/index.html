<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PQC Sign — Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="page-center">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>PQC Sign</h1>
        <p>Post-Quantum Document Signing</p>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Login</button>
        <button class="tab-btn" data-tab="register">Register</button>
      </div>

      <!-- Login -->
      <div id="tab-login" class="tab-panel active">
        <div id="login-alert" class="alert alert-error"></div>
        <div class="form-group">
          <label for="login-user">Username</label>
          <input type="text" id="login-user" placeholder="Enter username" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" placeholder="Enter password" autocomplete="current-password">
        </div>
        <div class="form-actions">
          <button id="login-btn" class="btn btn-primary">Login</button>
        </div>
      </div>

      <!-- Register -->
      <div id="tab-register" class="tab-panel">
        <div id="reg-alert"   class="alert alert-error"></div>
        <div id="reg-success" class="alert alert-success"></div>
        <div class="form-group">
          <label for="reg-user">Username</label>
          <input type="text" id="reg-user" placeholder="Choose a username" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="reg-pass">Password</label>
          <input type="password" id="reg-pass" placeholder="Choose a password" autocomplete="new-password">
        </div>
        <div class="form-actions">
          <button id="reg-btn" class="btn btn-primary">Create Account</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
